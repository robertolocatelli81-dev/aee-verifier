name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    # 3.9 has no setup-python build for ubuntu-26.04, which `ubuntu-latest` is becoming between 2026-10-19 and 2026-11-19
    # (actions/runner-images#14748): the floor runs on ubuntu-24.04, the other two on the current label
    runs-on: ${{ matrix.python-version == '3.9' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]   # the README declares 3.9 or later: the floor is tested too
    steps:
      - uses: actions/checkout@v7       # Node 24: Node 20 actions are no longer run (GitHub changelog, 2026-09-23)
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: "Standard library only: cryptography is not importable in this job"
        run: |
          python -c "import sys; print(sys.version)"
          if python -c "import cryptography" 2>/dev/null; then echo "::error::cryptography is importable: this job must run on the standard library only"; exit 1; fi
      - name: Every test file, with the count and the summary line the README states (a test that stops being collected, or a new skip, turns this red)
        run: |
          set -e
          check() {
            out=$(python -m unittest "tests.$1" 2>&1) || { echo "$out"; exit 1; }
            n=$(echo "$out" | sed -n 's/^Ran \([0-9]*\) test.*/\1/p' | tail -1)
            last=$(echo "$out" | tail -1)
            echo "tests/$1.py: $n tests (README: $2), summary: $last (expected: $3)"
            if [ "$n" != "$2" ]; then echo "::error::tests/$1.py ran $n tests, the README states $2"; exit 1; fi
            if [ "$last" != "$3" ]; then echo "::error::tests/$1.py ended with '$last', expected '$3'"; exit 1; fi
          }
          check test_verifier 163 "OK"
          check test_units 27 "OK (skipped=1)"      # the one skip is the optional cryptography oracle, run in the last step
          check test_review_fixes 26 "OK"
      - name: The whole suite through discovery (216 tests, as the README states; the only skip is the cryptography oracle)
        run: |
          set -e
          out=$(python -m unittest discover -s tests -p "test_*.py" 2>&1) || { echo "$out"; exit 1; }
          echo "$out" | tail -3
          echo "$out" | grep -qx "Ran 216 tests in [0-9.]*s" || { echo "::error::discovery did not run 216 tests"; exit 1; }
          [ "$(echo "$out" | tail -1)" = "OK (skipped=1)" ] || { echo "::error::expected exactly one skipped test (the cryptography oracle)"; exit 1; }
      - name: "The optional cryptography oracle of tests/test_units.py, skipped above, runs with cryptography installed: 27 tests, no skip"
        run: |
          set -e
          python -m pip install cryptography
          out=$(python -m unittest tests.test_units 2>&1) || { echo "$out"; exit 1; }
          echo "$out" | tail -3
          echo "$out" | grep -qx "Ran 27 tests in [0-9.]*s" || { echo "::error::did not run 27 tests"; exit 1; }
          [ "$(echo "$out" | tail -1)" = "OK" ] || { echo "::error::the cryptography oracle was still skipped"; exit 1; }
